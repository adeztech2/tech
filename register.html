<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | ADEZ TECH</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(0,255,136,0.12), transparent 35%),
        #050505;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo a {
      color: #fff;
      text-decoration: none;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #00ff88;
    }

    .logo p {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .register-box {
      background: #0b0b0b;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 32px 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #ddd;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #292929;
      background: #111;
      color: #fff;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 2px rgba(0,255,136,0.08);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 55px;
    }

    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 8px 0 20px;
      color: #777;
      font-size: 12px;
    }

    .terms input {
      width: auto;
      margin-top: 2px;
      accent-color: #00ff88;
    }

    .terms a {
      color: #00ff88;
      text-decoration: none;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 9px;
      background: #00ff88;
      color: #000;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,255,136,0.18);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
    }

    .error {
      display: block;
      background: rgba(255,0,0,0.08);
      border: 1px solid rgba(255,0,0,0.2);
      color: #ff7070;
    }

    .success {
      display: block;
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.2);
      color: #00ff88;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #777;
      font-size: 13px;
    }

    .login a {
      color: #00ff88;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      color: #00ff88;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <a href="index.html">ADEZ<span>TECH</span></a>
      <p>Digital Solutions & Innovation</p>
    </div>

    <div class="register-box">

      <h1>Create Account</h1>

      <p class="subtitle">
        Join ADEZ TECH today
      </p>

      <form id="registerForm">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">WhatsApp Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="+254..."
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Create a password"
              minlength="6"
              required
            >

            <span
              class="show-password"
              onclick="togglePassword('password', this)">
              Show
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm your password"
              minlength="6"
              required
            >

            <span
              class="show-password"
              onclick="togglePassword('confirmPassword', this)">
              Show
            </span>
          </div>
        </div>

        <div class="terms">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">
            I agree to the ADEZ TECH
            <a href="#">Terms & Conditions</a>
            and
            <a href="#">Privacy Policy</a>.
          </label>

        </div>

        <button type="submit" id="registerButton">
          Create Account
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

    <a href="index.html" class="back">
      ← Back to ADEZ TECH
    </a>

  </div>

  <script>

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    function togglePassword(id, element) {

      const input = document.getElementById(id);

      if (input.type === "password") {
        input.type = "text";
        element.textContent = "Hide";
      } else {
        input.type = "password";
        element.textContent = "Show";
      }
    }

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.className = "message";
      message.textContent = "";

      if (password.length < 6) {

        message.textContent =
          "Password must contain at least 6 characters.";

        message.classList.add("error");

        return;
      }

      if (password !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        message.classList.add("error");

        return;
      }

      button.disabled = true;
      button.textContent = "Creating Account...";

      /*
        TEMPORARY FRONTEND DEMO

        This stores the registration locally only.
        For a REAL website, we will connect this form
        to a backend/database such as MongoDB or Supabase.
      */

      const user = {
        name: name,
        email: email,
        phone: phone
      };

      localStorage.setItem(
        "adezUser",
        JSON.stringify(user)
      );

      setTimeout(function() {

        message.textContent =
          "Account created successfully!";

        message.classList.add("success");

        button.disabled = false;
        button.textContent = "Create Account";

        setTimeout(function() {
          window.location.href = "login.html";
        }, 1200);

      }, 800);

    });

  </script>

</body>
</html>
