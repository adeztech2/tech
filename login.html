<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | ADEZ TECH</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(0,255,136,0.10), transparent 35%),
        #050505;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #00ff88;
    }

    .card {
      background: #0b0b0b;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 35px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .title {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #050505;
      color: #fff;
      border: 1px solid #292929;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 2px rgba(0,255,136,0.08);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #00ff88;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 22px;
    }

    .forgot a {
      color: #00ff88;
      font-size: 13px;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #00ff88;
      color: #000;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,255,136,0.18);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }

    .error {
      display: block;
      background: rgba(255,0,0,0.08);
      border: 1px solid rgba(255,0,0,0.3);
      color: #ff7070;
    }

    .success {
      display: block;
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.3);
      color: #00ff88;
    }

    .register {
      text-align: center;
      color: #888;
      margin-top: 25px;
      font-size: 14px;
    }

    .register a {
      color: #00ff88;
      font-weight: bold;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #777;
      font-size: 13px;
    }

    .back a:hover {
      color: #00ff88;
    }

    .secure {
      text-align: center;
      margin-top: 22px;
      color: #555;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }

      .logo {
        font-size: 26px;
      }

      .title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ADEZ<span>TECH</span>
    </div>

    <div class="card">

      <h1 class="title">Welcome Back</h1>

      <p class="subtitle">
        Login to your ADEZ TECH account
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">

          <label for="password">Password</label>

          <div class="password-box">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword()">
              SHOW
            </button>

          </div>

        </div>

        <div class="forgot">
          <a href="forgot-password.html">
            Forgot password?
          </a>
        </div>

        <button
          type="submit"
          class="login-btn"
          id="loginBtn">
          LOGIN
        </button>

      </form>

      <div class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
      </div>

      <div class="back">
        <a href="index.html">← Back to ADEZ TECH</a>
      </div>

      <div class="secure">
        🔒 Your account information is protected.
      </div>

    </div>

  </div>

  <script>

    function togglePassword() {

      const password = document.getElementById("password");
      const button = document.querySelector(".show-password");

      if (password.type === "password") {
        password.type = "text";
        button.textContent = "HIDE";
      } else {
        password.type = "password";
        button.textContent = "SHOW";
      }

    }


    document.getElementById("loginForm").addEventListener("submit", function(e) {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");

      const button =
        document.getElementById("loginBtn");


      message.className = "message";
      message.textContent = "";


      if (!email || !password) {

        message.className = "message error";
        message.textContent = "Please enter your email and password.";

        return;
      }


      /*
        FRONTEND DEMO

        This page is ready for a backend.

        When we build the ADEZ TECH backend,
        this section will send the credentials
        securely to the server.

        Example endpoint:

        POST /api/login
      */


      button.disabled = true;
      button.textContent = "LOGGING IN...";


      setTimeout(function() {

        /*
          Temporary demo login.

          Replace this with the real API
          when the backend is connected.
        */

        message.className = "message success";
        message.textContent = "Login successful. Redirecting...";

        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 800);

      }, 1000);

    });

  </script>

</body>
</html>
